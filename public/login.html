<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعيتي - تسجيل الدخول</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/W3vY4xmJ/Gam3ety.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
               ROOT VARIABLES
               ============================================================ */
        :root {
            --primary: #0F2B3D;
            --primary-light: #1A4058;
            --primary-dark: #091E2A;
            --accent: #F59E0B;
            --accent-light: #FBBF24;
            --accent-soft: rgba(245, 158, 11, 0.12);
            --success: #0E8F6B;
            --success-soft: rgba(14, 143, 107, 0.12);
            --danger: #D05A5A;
            --danger-soft: rgba(208, 90, 90, 0.12);
            --info: #3B82F6;
            --info-soft: rgba(59, 130, 246, 0.12);

            --bg-body: #F0F2F5;
            --bg-card: rgba(255, 255, 255, 0.75);
            --bg-glass: rgba(255, 255, 255, 0.55);
            --bg-input: #FFFFFF;

            --text-primary: #0B1A2E;
            --text-secondary: #4B5B6E;
            --text-muted: #8896A8;
            --text-white: #FFFFFF;

            --border-light: #E9EDF4;

            --shadow-sm: 0 2px 8px rgba(11, 26, 46, 0.06);
            --shadow-md: 0 8px 30px rgba(11, 26, 46, 0.08);
            --shadow-lg: 0 20px 60px rgba(11, 26, 46, 0.12);
            --shadow-xl: 0 30px 80px rgba(11, 26, 46, 0.16);

            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 9999px;

            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;

            --font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================================
               DARK MODE
               ============================================================ */
        [data-theme="dark"] {
            --bg-body: #0F1724;
            --bg-card: rgba(22, 34, 50, 0.85);
            --bg-glass: rgba(18, 28, 42, 0.75);
            --bg-input: rgba(31, 46, 66, 0.8);

            --text-primary: #F1F5F9;
            --text-secondary: #B0C4DB;
            --text-muted: #7B8DA3;

            --border-light: #2A3A52;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        /* ============================================================
               RESET & BASE
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
            transition: var(--transition-slow);
            background-image:
                radial-gradient(ellipse at 15% 20%, rgba(15, 43, 61, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 85% 80%, rgba(245, 158, 11, 0.04) 0%, transparent 60%);
        }

        [data-theme="dark"] body {
            background-image:
                radial-gradient(ellipse at 15% 20%, rgba(26, 64, 88, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 85% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 60%);
        }

        /* ============================================================
               GLASS CARD
               ============================================================ */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            transition: var(--transition-slow);
        }

        .glass-card:hover {
            box-shadow: var(--shadow-xl);
        }

        [data-theme="dark"] .glass-card {
            border-color: rgba(255, 255, 255, 0.06);
        }

        /* ============================================================
               CONTAINER
               ============================================================ */
        .container {
            max-width: 420px;
            width: 100%;
            padding: var(--spacing-xl);
            position: relative;
        }

        /* ============================================================
               HEADER
               ============================================================ */
        .header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-sm);
        }

        .logo-wrapper img {
            height: 50px;
            width: auto;
            filter: drop-shadow(0 4px 12px rgba(15, 43, 61, 0.08));
            transition: var(--transition);
        }

        [data-theme="dark"] .logo-wrapper img {
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        .logo-wrapper h1 {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(145deg, var(--primary), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .header .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            margin-top: var(--spacing-xs);
        }

        /* ============================================================
               FORM
               ============================================================ */
        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-family: var(--font-family);
            font-size: 15px;
            transition: var(--transition);
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 43, 61, 0.08);
        }

        [data-theme="dark"] .form-control:focus {
            box-shadow: 0 0 0 4px rgba(26, 64, 88, 0.25);
        }

        .form-control.error {
            border-color: var(--danger);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        /* ============================================================
               BUTTONS
               ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: 16px 32px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-family);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0);
            transition: var(--transition);
        }

        .btn:hover::after {
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--text-white);
            box-shadow: 0 4px 16px rgba(15, 43, 61, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(15, 43, 61, 0.3);
            background: var(--primary-light);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-primary:disabled::after {
            display: none;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: var(--text-white);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-sm {
            padding: 8px 20px;
            font-size: 13px;
            border-radius: var(--radius-sm);
            width: auto;
        }

        /* ============================================================
               SPINNER
               ============================================================ */
        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
               FOOTER
               ============================================================ */
        .footer {
            text-align: center;
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--border-light);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .footer a:hover {
            color: var(--accent);
        }

        .footer p {
            margin-top: var(--spacing-sm);
            font-size: 13px;
        }

        .footer p strong {
            color: var(--primary);
        }

        /* ============================================================
               THEME TOGGLE
               ============================================================ */
        .theme-toggle {
            position: fixed;
            top: var(--spacing-md);
            left: var(--spacing-md);
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            z-index: 1000;
            box-shadow: var(--shadow-sm);
        }

        .theme-toggle:hover {
            transform: scale(1.06) rotate(6deg);
            box-shadow: var(--shadow-md);
        }

        /* ============================================================
               NOTIFICATION
               ============================================================ */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 28px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-xl);
            border-right: 5px solid var(--success);
            z-index: 9999;
            max-width: 400px;
            font-family: var(--font-family);
            color: var(--text-primary);
            font-weight: 500;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
        }

        .notification-error {
            border-right-color: var(--danger);
        }

        .notification-success {
            border-right-color: var(--success);
        }

        .notification-info {
            border-right-color: var(--info);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ============================================================
               SHAKE ANIMATION
               ============================================================ */
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-6px);
            }
            20%,
            40%,
            60%,
            80% {
                transform: translateX(6px);
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* ============================================================
               RESPONSIVE
               ============================================================ */
        @media (max-width: 480px) {
            body {
                padding: var(--spacing-sm);
            }

            .container {
                padding: var(--spacing-lg);
            }

            .logo-wrapper img {
                height: 40px;
            }

            .logo-wrapper h1 {
                font-size: 24px;
            }

            .form-control {
                font-size: 14px;
                padding: 12px 14px;
            }

            .btn {
                font-size: 14px;
                padding: 14px 24px;
            }

            .theme-toggle {
                top: var(--spacing-sm);
                left: var(--spacing-sm);
                width: 38px;
                height: 38px;
                font-size: 16px;
            }

            .notification {
                right: 16px;
                left: 16px;
                bottom: 16px;
                max-width: calc(100% - 32px);
                padding: 14px 20px;
                font-size: 14px;
            }
        }

        /* ============================================================
               ACCESSIBILITY
               ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        *:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        ::selection {
            background: var(--primary);
            color: white;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
    </style>
</head>
<body>

    <!-- Theme Toggle -->
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="تبديل المظهر">
        <span id="themeIcon">🌙</span>
    </button>

    <!-- Main Container -->
    <div class="container glass-card">

        <!-- Header -->
        <header class="header">
            <div class="logo-wrapper">
                <img src="https://i.postimg.cc/W3vY4xmJ/Gam3ety.png" alt="جمعيتي">
                <h1>جمعيتي</h1>
            </div>
            <p class="subtitle">تسجيل الدخول إلى لوحة التحكم</p>
        </header>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">اسم المستخدم</label>
                <input
                    type="text"
                    id="username"
                    class="form-control"
                    placeholder="أدخل اسم المستخدم"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">كلمة المرور</label>
                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="أدخل كلمة المرور"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn btn-primary" id="loginBtn">
                تسجيل الدخول
            </button>
        </form>

        <!-- Footer -->
        <footer class="footer">
            <a href="/">← العودة إلى الصفحة الرئيسية</a>
            <p>© 2026 <strong>جمعيتي</strong> · جميع الحقوق محفوظة</p>
        </footer>

    </div>

    <script>
        // ============================================================
        // THEME
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        // ============================================================
        // LOGIN
        // ============================================================
        async function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            // Validate
            if (!username || !password) {
                showNotification('يرجى ملء جميع الحقول', 'error');
                if (!username) document.getElementById('username').classList.add('error');
                if (!password) document.getElementById('password').classList.add('error');
                return;
            }

            // Remove error states
            document.querySelectorAll('.form-control').forEach(el => el.classList.remove('error'));

            // Loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> جاري التحميل...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify({ username }));

                    showNotification('✅ تم تسجيل الدخول بنجاح!', 'success');

                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 800);
                } else {
                    showNotification(data.error || 'بيانات الدخول غير صحيحة', 'error');
                    document.querySelector('.container').classList.add('shake');
                    setTimeout(() => {
                        document.querySelector('.container').classList.remove('shake');
                    }, 500);

                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'تسجيل الدخول';
                }
            } catch (error) {
                console.error('Login error:', error);
                showNotification('حدث خطأ في الاتصال بالخادم', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'تسجيل الدخول';
            }
        }

        // ============================================================
        // NOTIFICATION
        // ============================================================
        function showNotification(message, type = 'info') {
            const existing = document.querySelector('.notification');
            if (existing) existing.remove();

            const icons = {
                success: '✅',
                error: '❌',
                info: 'ℹ️'
            };

            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.innerHTML = `<span>${icons[type] || '📢'}</span> ${message}`;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transform = 'translateY(20px) scale(0.95)';
                notification.style.transition = 'all 0.3s ease-out';
                setTimeout(() => notification.remove(), 300);
            }, 4000);
        }

        // ============================================================
        // ENTER KEY
        // ============================================================
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        // ============================================================
        // REMOVE ERROR ON FOCUS
        // ============================================================
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('focus', function() {
                this.classList.remove('error');
            });
        });

        // ============================================================
        // CHECK EXISTING SESSION
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (token) {
                fetch('/api/members', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                }).then(response => {
                    if (response.ok) {
                        window.location.href = '/dashboard';
                    } else {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                    }
                }).catch(() => {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                });
            }
        });
    </script>

</body>
</html>
