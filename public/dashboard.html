<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمعيتي - لوحة التحكم</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/W3vY4xmJ/Gam3ety.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
               ROOT VARIABLES
               ============================================================ */
        :root {
            --primary: #0F2B3D;
            --primary-light: #1A4058;
            --primary-dark: #091E2A;
            --accent: #F59E0B;
            --accent-light: #FBBF24;
            --accent-soft: rgba(245, 158, 11, 0.12);
            --success: #0E8F6B;
            --success-soft: rgba(14, 143, 107, 0.12);
            --danger: #D05A5A;
            --danger-soft: rgba(208, 90, 90, 0.12);
            --info: #3B82F6;
            --info-soft: rgba(59, 130, 246, 0.12);

            --bg-body: #F0F2F5;
            --bg-card: rgba(255, 255, 255, 0.75);
            --bg-glass: rgba(255, 255, 255, 0.55);
            --bg-input: #FFFFFF;

            --text-primary: #0B1A2E;
            --text-secondary: #4B5B6E;
            --text-muted: #8896A8;
            --text-white: #FFFFFF;

            --border-light: #E9EDF4;

            --shadow-sm: 0 2px 8px rgba(11, 26, 46, 0.06);
            --shadow-md: 0 8px 30px rgba(11, 26, 46, 0.08);
            --shadow-lg: 0 20px 60px rgba(11, 26, 46, 0.12);
            --shadow-xl: 0 30px 80px rgba(11, 26, 46, 0.16);

            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-full: 9999px;

            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;

            --font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============================================================
               DARK MODE
               ============================================================ */
        [data-theme="dark"] {
            --bg-body: #0F1724;
            --bg-card: rgba(22, 34, 50, 0.85);
            --bg-glass: rgba(18, 28, 42, 0.75);
            --bg-input: rgba(31, 46, 66, 0.8);

            --text-primary: #F1F5F9;
            --text-secondary: #B0C4DB;
            --text-muted: #7B8DA3;

            --border-light: #2A3A52;

            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        /* ============================================================
               RESET & BASE
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition-slow);
        }

        /* ============================================================
               DASHBOARD LAYOUT
               ============================================================ */
        .dashboard-layout {
            display: flex;
            min-height: 100vh;
        }

        /* ============================================================
               SIDEBAR
               ============================================================ */
        .sidebar {
            width: 260px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-left: 1px solid var(--border-light);
            padding: var(--spacing-lg);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: var(--transition);
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        [data-theme="dark"] .sidebar {
            border-left-color: var(--border-light);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--border-light);
        }

        .sidebar-logo img {
            height: 38px;
            width: auto;
        }

        .sidebar-logo h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary);
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
        }

        .sidebar-nav li {
            margin-bottom: var(--spacing-xs);
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            transition: var(--transition);
            font-weight: 600;
            font-size: 14px;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background: var(--accent-soft);
            color: var(--primary);
        }

        .sidebar-nav a .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }

        .sidebar-footer {
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--border-light);
        }

        .sidebar-footer .user-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-md);
        }

        .sidebar-footer .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
            flex-shrink: 0;
        }

        .sidebar-footer .user-name {
            font-weight: 700;
            font-size: 15px;
        }

        .sidebar-footer .user-role {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ============================================================
               MAIN CONTENT
               ============================================================ */
        .main-content {
            flex: 1;
            margin-right: 260px;
            padding: var(--spacing-lg);
            transition: var(--transition);
        }

        /* ============================================================
               TOP BAR
               ============================================================ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-xl);
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .top-bar h2 {
            font-size: 22px;
            font-weight: 800;
        }

        .top-bar-actions {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        /* ============================================================
               BUTTONS
               ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: var(--font-family);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--text-white);
            box-shadow: 0 4px 16px rgba(15, 43, 61, 0.15);
        }

        .btn-primary:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(15, 43, 61, 0.2);
        }

        .btn-secondary {
            background: var(--bg-glass);
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }

        .btn-secondary:hover {
            background: var(--border-light);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 16px rgba(208, 90, 90, 0.15);
        }

        .btn-danger:hover {
            background: #c04a4a;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
            box-shadow: 0 4px 16px rgba(14, 143, 107, 0.15);
        }

        .btn-success:hover {
            background: #0c7a5a;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 12px;
        }

        .btn-xs {
            padding: 4px 12px;
            font-size: 11px;
            border-radius: var(--radius-sm);
        }

        /* ============================================================
               STATS
               ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg) var(--spacing-md);
            text-align: center;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .stat-card .stat-icon {
            font-size: 28px;
            margin-bottom: var(--spacing-xs);
            opacity: 0.7;
        }

        .stat-card .stat-number {
            font-size: 30px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .stat-card .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 2px;
        }

        /* ============================================================
               TABLE
               ============================================================ */
        .table-container {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--border-light);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .table-header h3 {
            font-size: 17px;
            font-weight: 800;
        }

        .table-header-actions {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            padding: 8px 16px;
            border: 2px solid var(--border-light);
            border-radius: var(--radius-full);
            font-family: var(--font-family);
            font-size: 13px;
            transition: var(--transition);
            background: var(--bg-input);
            color: var(--text-primary);
            min-width: 180px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 43, 61, 0.06);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .table-responsive {
            overflow-x: auto;
            padding: 0 var(--spacing-sm) var(--spacing-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        thead th {
            padding: var(--spacing-md) var(--spacing-sm);
            text-align: right;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-light);
            white-space: nowrap;
        }

        tbody tr {
            transition: var(--transition);
            border-bottom: 1px solid var(--border-light);
        }

        tbody tr:hover {
            background: var(--accent-soft);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        td {
            padding: var(--spacing-md) var(--spacing-sm);
            vertical-align: middle;
            font-size: 13px;
            color: var(--text-secondary);
        }

        td strong {
            color: var(--text-primary);
        }

        .table-actions {
            display: flex;
            gap: var(--spacing-xs);
            flex-wrap: wrap;
        }

        /* ============================================================
               BADGE
               ============================================================ */
        .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 700;
        }

        .badge-active {
            background: var(--success-soft);
            color: var(--success);
        }

        .badge-finished {
            background: var(--info-soft);
            color: var(--info);
        }

        .badge-pending {
            background: var(--accent-soft);
            color: var(--accent);
        }

        /* ============================================================
               MODAL
               ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: var(--spacing-md);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            border-radius: var(--radius-lg);
            max-width: 750px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-light);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-light);
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 800;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            padding: 4px 8px;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }

        .modal-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }

        .modal-form .form-group {
            margin-bottom: var(--spacing-md);
        }

        .modal-form label {
            display: block;
            font-weight: 700;
            margin-bottom: var(--spacing-xs);
            font-size: 13px;
            color: var(--text-primary);
        }

        .modal-form input,
        .modal-form select,
        .modal-form textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-family: var(--font-family);
            font-size: 14px;
            transition: var(--transition);
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .modal-form input:focus,
        .modal-form select:focus,
        .modal-form textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 43, 61, 0.06);
        }

        .modal-form textarea {
            resize: vertical;
            min-height: 60px;
        }

        .modal-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-md);
            border-top: 1px solid var(--border-light);
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* ============================================================
               LOADING
               ============================================================ */
        .loading-container {
            display: none;
            text-align: center;
            padding: var(--spacing-2xl) var(--spacing-xl);
        }

        .loading-container.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ============================================================
               EMPTY STATE
               ============================================================ */
        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl) var(--spacing-lg);
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: var(--spacing-md);
            opacity: 0.4;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        /* ============================================================
               NOTIFICATION
               ============================================================ */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-xl);
            border-right: 5px solid var(--success);
            z-index: 9999;
            max-width: 400px;
            font-family: var(--font-family);
            color: var(--text-primary);
            font-weight: 500;
            animation: slideUp 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            border: 1px solid var(--border-light);
            border-right-width: 5px;
        }

        .notification-error {
            border-right-color: var(--danger);
        }
        .notification-success {
            border-right-color: var(--success);
        }
        .notification-info {
            border-right-color: var(--info);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
               THEME TOGGLE
               ============================================================ */
        .theme-toggle {
            background: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: var(--border-light);
            transform: scale(1.05);
        }

        /* ============================================================
               MOBILE
               ============================================================ */
        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
        }

        .mobile-menu-toggle:hover {
            background: var(--border-light);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 99;
            backdrop-filter: blur(4px);
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* ============================================================
               RESPONSIVE
               ============================================================ */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(100%);
                right: -260px;
            }

            .sidebar.open {
                transform: translateX(0);
                right: 0;
            }

            .main-content {
                margin-right: 0;
            }

            .mobile-menu-toggle {
                display: block;
            }

            .sidebar-overlay.active {
                display: block;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding: var(--spacing-sm);
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: var(--spacing-md);
                padding: var(--spacing-md);
            }

            .top-bar h2 {
                font-size: 18px;
            }

            .top-bar-actions {
                justify-content: space-between;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: var(--spacing-sm);
            }

            .stat-card .stat-number {
                font-size: 24px;
            }

            .modal {
                padding: var(--spacing-lg);
                margin: var(--spacing-sm);
            }

            .modal-form .form-row {
                grid-template-columns: 1fr;
            }

            .table-header {
                flex-direction: column;
                align-items: stretch;
                gap: var(--spacing-md);
                padding: var(--spacing-md);
            }

            .table-header-actions {
                flex-direction: column;
            }

            .table-header-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .search-input {
                width: 100%;
                min-width: unset;
            }

            .notification {
                right: 16px;
                left: 16px;
                bottom: 16px;
                max-width: calc(100% - 32px);
            }

            table {
                min-width: 700px;
            }

            th,
            td {
                padding: var(--spacing-sm) var(--spacing-xs);
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: var(--spacing-xs);
            }

            .stat-card {
                padding: var(--spacing-md) var(--spacing-sm);
            }

            .stat-card .stat-number {
                font-size: 20px;
            }

            .stat-card .stat-label {
                font-size: 12px;
            }

            .modal {
                padding: var(--spacing-md);
            }

            .modal-actions {
                flex-direction: column;
            }

            .modal-actions .btn {
                width: 100%;
            }

            .btn-xs {
                padding: 2px 8px;
                font-size: 10px;
            }
        }

        /* ============================================================
               ACCESSIBILITY
               ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        *:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        ::selection {
            background: var(--primary);
            color: white;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-body);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
    </style>
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Dashboard Layout -->
    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <img src="https://i.postimg.cc/W3vY4xmJ/Gam3ety.png" alt="جمعيتي">
                <h1>جمعيتي</h1>
            </div>

            <ul class="sidebar-nav">
                <li>
                    <a href="#" class="active">
                        <span class="icon">📊</span>
                        لوحة التحكم
                    </a>
                </li>
                <li>
                    <a href="/">
                        <span class="icon">🔍</span>
                        البحث عن عضو
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">أ</div>
                    <div>
                        <div class="user-name" id="userName">الإدمن</div>
                        <div class="user-role">مدير النظام</div>
                    </div>
                </div>
                <button class="btn btn-danger btn-sm" onclick="handleLogout()" style="width:100%;">
                    تسجيل الخروج
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Top Bar -->
            <div class="top-bar">
                <div class="top-bar-left">
                    <button class="mobile-menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h2>لوحة التحكم</h2>
                </div>
                <div class="top-bar-actions">
                    <button class="theme-toggle" onclick="toggleTheme()" aria-label="تبديل المظهر">
                        <span id="themeIcon">🌙</span>
                    </button>
                    <button class="btn btn-primary" onclick="openCreateModal()">
                        ➕ إضافة عضو
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-number" id="totalMembers">0</div>
                    <div class="stat-label">إجمالي الأعضاء</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🟢</div>
                    <div class="stat-number" id="activeMembers">0</div>
                    <div class="stat-label">نشطون</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🔵</div>
                    <div class="stat-number" id="finishedMembers">0</div>
                    <div class="stat-label">منتهيون</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-number" id="totalCollections">0</div>
                    <div class="stat-label">إجمالي التحصيل</div>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <div class="table-header">
                    <h3>📋 قائمة الأعضاء</h3>
                    <div class="table-header-actions">
                        <input
                            type="text"
                            class="search-input"
                            id="searchInput"
                            placeholder="بحث باسم أو رقم..."
                            oninput="filterMembers()"
                        >
                        <button class="btn btn-secondary btn-sm" onclick="refreshData()">🔄 تحديث</button>
                    </div>
                </div>

                <div class="loading-container" id="tableLoading">
                    <div class="spinner"></div>
                    <p style="margin-top:var(--spacing-md);color:var(--text-muted);">جاري تحميل البيانات...</p>
                </div>

                <div class="table-responsive" id="tableContent">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>الاسم</th>
                                <th>الهاتف</th>
                                <th>الشهري</th>
                                <th>المدفوع</th>
                                <th>المتبقي</th>
                                <th>المستلم</th>
                                <th>الدور</th>
                                <th>تاريخ الاستلام</th>
                                <th>المتبقي للاسم</th>
                                <th>الحالة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="membersTableBody"></tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="memberModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">إضافة عضو جديد</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>

            <form class="modal-form" id="memberForm" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="editId">

                <div class="form-row">
                    <div class="form-group">
                        <label for="name">الاسم الكامل *</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">رقم الهاتف *</label>
                        <input type="tel" id="phone" required dir="ltr" pattern="01[0-2][0-9]{8}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="monthlyPayment">المبلغ الشهري *</label>
                        <input type="number" id="monthlyPayment" required min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="gameyaValue">قيمة الجمعية *</label>
                        <input type="number" id="gameyaValue" required min="0" step="0.01">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="paidAmount">المبلغ المدفوع *</label>
                        <input type="number" id="paidAmount" required min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="remainingAmount">المبلغ المتبقي *</label>
                        <input type="number" id="remainingAmount" required min="0" step="0.01">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="paidMonths">الأشهر المدفوعة *</label>
                        <input type="number" id="paidMonths" required min="0">
                    </div>
                    <div class="form-group">
                        <label for="remainingMonths">الأشهر المتبقية *</label>
                        <input type="number" id="remainingMonths" required min="0">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="receiveAmount">المبلغ المستلم *</label>
                        <input type="number" id="receiveAmount" required min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="collectionOrder">دور الاستلام *</label>
                        <input type="text" id="collectionOrder" required placeholder="مثال: الأول">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="collectionDate">تاريخ الاستلام *</label>
                        <input type="date" id="collectionDate" required>
                    </div>
                    <div class="form-group">
                        <label for="remainingName">المتبقي للاسم *</label>
                        <input type="text" id="remainingName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="status">الحالة *</label>
                        <select id="status" required>
                            <option value="نشط">نشط</option>
                            <option value="منتهي">منتهي</option>
                            <option value="معلق">معلق</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">ملاحظات</label>
                    <textarea id="notes" rows="3"></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">حفظ</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        // THEME
        // ============================================================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeIcon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        // ============================================================
        // SIDEBAR
        // ============================================================
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // ============================================================
        // AUTH
        // ============================================================
        function checkAuth() {
            if (!localStorage.getItem('token')) {
                window.location.href = '/login';
                return false;
            }
            return true;
        }

        function getUserInfo() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (user?.username) {
                    document.getElementById('userName').textContent = user.username;
                    document.getElementById('userAvatar').textContent = user.username.charAt(0);
                }
            } catch (e) {}
        }

        function handleLogout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.clear();
                window.location.href = '/login';
            }
        }

        // ============================================================
        // STATE
        // ============================================================
        let members = [];
        let filtered = [];

        // ============================================================
        // LOAD DASHBOARD
        // ============================================================
        async function loadDashboard() {
            if (!checkAuth()) return;
            getUserInfo();
            await loadStats();
            await loadMembers();
        }

        async function loadStats() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const d = await res.json();
                    document.getElementById('totalMembers').textContent = d.totalMembers || 0;
                    document.getElementById('activeMembers').textContent = d.activeMembers || 0;
                    document.getElementById('finishedMembers').textContent = d.finishedMembers || 0;
                    document.getElementById('totalCollections').textContent = (d.totalCollections || 0).toLocaleString('ar-EG');
                } else if (res.status === 401) handleLogout();
            } catch (e) {
                showNotification('خطأ في الإحصائيات', 'error');
            }
        }

        async function loadMembers() {
            const loading = document.getElementById('tableLoading');
            const content = document.getElementById('tableContent');
            loading.classList.add('active');
            content.style.display = 'none';

            try {
                const token = localStorage.getItem('token');
                const res = await fetch('/api/members', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    members = await res.json();
                    filtered = [...members];
                    renderTable();
                } else if (res.status === 401) {
                    handleLogout();
                } else {
                    showNotification('خطأ في تحميل الأعضاء', 'error');
                }
            } catch (e) {
                showNotification('خطأ في الاتصال', 'error');
            }
            loading.classList.remove('active');
            content.style.display = 'block';
        }

        // ============================================================
        // RENDER TABLE
        // ============================================================
        function renderTable() {
            const tbody = document.getElementById('membersTableBody');
            if (!filtered.length) {
                tbody.innerHTML = `
                    <tr><td colspan="12">
                        <div class="empty-state">
                            <div class="icon">📋</div>
                            <h3>لا يوجد أعضاء</h3>
                            <p>قم بإضافة عضو جديد</p>
                        </div>
                    </td></tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map((m, i) => {
                const statusClass = m.status === 'نشط' ? 'badge-active' :
                    m.status === 'منتهي' ? 'badge-finished' : 'badge-pending';
                return `<tr>
                    <td>${i + 1}</td>
                    <td><strong>${m.name || '-'}</strong></td>
                    <td dir="ltr">${m.phone || '-'}</td>
                    <td>${(m.monthlyPayment || 0).toLocaleString('ar-EG')}</td>
                    <td>${(m.paidAmount || 0).toLocaleString('ar-EG')}</td>
                    <td>${(m.remainingAmount || 0).toLocaleString('ar-EG')}</td>
                    <td>${(m.receiveAmount || 0).toLocaleString('ar-EG')}</td>
                    <td>${m.collectionOrder || '-'}</td>
                    <td>${m.collectionDate || '-'}</td>
                    <td>${m.remainingName || '-'}</td>
                    <td><span class="badge ${statusClass}">${m.status || 'غير معروف'}</span></td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-primary btn-xs" onclick="openEditModal('${m.id}')">تعديل</button>
                            <button class="btn btn-danger btn-xs" onclick="deleteMember('${m.id}')">حذف</button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        function filterMembers() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            filtered = q ? members.filter(m =>
                (m.name || '').toLowerCase().includes(q) ||
                (m.phone || '').includes(q)
            ) : [...members];
            renderTable();
        }

        function refreshData() {
            loadStats();
            loadMembers();
            showNotification('تم التحديث', 'success');
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openCreateModal() {
            document.getElementById('modalTitle').textContent = 'إضافة عضو جديد';
            document.getElementById('editId').value = '';
            document.getElementById('memberForm').reset();
            document.getElementById('submitBtn').textContent = 'إضافة';
            document.getElementById('memberModal').classList.add('active');
        }

        function openEditModal(id) {
            const m = members.find(x => x.id === id);
            if (!m) return showNotification('العضو غير موجود', 'error');

            document.getElementById('modalTitle').textContent = 'تعديل عضو';
            document.getElementById('editId').value = id;
            ['name', 'phone', 'monthlyPayment', 'gameyaValue', 'paidAmount', 'remainingAmount',
                'paidMonths', 'remainingMonths', 'receiveAmount', 'collectionOrder',
                'collectionDate', 'remainingName', 'notes'
            ].forEach(f => {
                const el = document.getElementById(f);
                if (el) el.value = m[f] || '';
            });
            document.getElementById('status').value = m.status || 'نشط';
            document.getElementById('submitBtn').textContent = 'تحديث';
            document.getElementById('memberModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('memberModal').classList.remove('active');
            document.getElementById('memberForm').reset();
        }

        // ============================================================
        // FORM SUBMIT
        // ============================================================
        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const data = {
                name: document.getElementById('name').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                monthlyPayment: parseFloat(document.getElementById('monthlyPayment').value),
                gameyaValue: parseFloat(document.getElementById('gameyaValue').value),
                paidAmount: parseFloat(document.getElementById('paidAmount').value),
                remainingAmount: parseFloat(document.getElementById('remainingAmount').value),
                paidMonths: parseInt(document.getElementById('paidMonths').value),
                remainingMonths: parseInt(document.getElementById('remainingMonths').value),
                receiveAmount: parseFloat(document.getElementById('receiveAmount').value),
                collectionOrder: document.getElementById('collectionOrder').value.trim(),
                collectionDate: document.getElementById('collectionDate').value,
                remainingName: document.getElementById('remainingName').value.trim(),
                status: document.getElementById('status').value,
                notes: document.getElementById('notes').value.trim()
            };

            if (!data.phone.match(/^01[0-2][0-9]{8}$/)) {
                return showNotification('رقم هاتف غير صحيح', 'error');
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'جاري...';

            try {
                const token = localStorage.getItem('token');
                const url = id ? `/api/member/${id}` : '/api/member';
                const method = id ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if (res.ok) {
                    showNotification('تم الحفظ ✅', 'success');
                    closeModal();
                    loadMembers();
                    loadStats();
                } else {
                    showNotification(json.error || 'حدث خطأ', 'error');
                }
            } catch (e) {
                showNotification('خطأ في الاتصال', 'error');
            }
            btn.disabled = false;
            btn.textContent = id ? 'تحديث' : 'إضافة';
        }

        // ============================================================
        // DELETE
        // ============================================================
        async function deleteMember(id) {
            if (!confirm('حذف هذا العضو نهائياً؟')) return;
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`/api/member/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    showNotification('تم الحذف', 'success');
                    loadMembers();
                    loadStats();
                } else {
                    showNotification('خطأ في الحذف', 'error');
                }
            } catch (e) {
                showNotification('خطأ في الاتصال', 'error');
            }
        }

        // ============================================================
        // NOTIFICATION
        // ============================================================
        function showNotification(msg, type = 'info') {
            const old = document.querySelector('.notification');
            if (old) old.remove();

            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            const el = document.createElement('div');
            el.className = `notification notification-${type}`;
            el.innerHTML = `<span>${icons[type] || '📢'}</span> ${msg}`;
            document.body.appendChild(el);

            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'all 0.3s ease';
                setTimeout(() => el.remove(), 300);
            }, 3500);
        }

        // ============================================================
        // EVENTS
        // ============================================================
        document.getElementById('memberModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>

</body>
</html>
